<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Convertitore File</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
</head>
<body class="bg-light py-5">

  <div class="container" style="max-width: 650px;">

    <h1 class="mb-1">🔄 Convertitore File</h1>
    <p class="text-secondary mb-4">
      Carica un file <strong>JSON</strong>, <strong>XML</strong> o <strong>CSV</strong>
      e convertilo nel formato che vuoi.
    </p>

    <!-- STEP 1: carica il file -->
    <div class="card mb-3">
      <div class="card-body">
        <label class="form-label fw-bold">① Carica il file sorgente</label>
        <input type="file" id="fileInput" accept=".json,.xml,.csv" class="form-control">
        <div id="infoFile" class="mt-2 small text-secondary d-none"></div>
      </div>
    </div>

    <div class="text-center fs-4 text-secondary mb-3">↓</div>

    <!-- STEP 2: scegli il formato -->
    <div class="card mb-3">
      <div class="card-body">
        <label for="formatoDestinazione" class="form-label fw-bold">
          ② Scegli il formato di destinazione
        </label>
        <select id="formatoDestinazione" class="form-select">
          <option value="">-- seleziona --</option>
          <option value="json">JSON</option>
          <option value="xml">XML</option>
          <option value="csv">CSV</option>
        </select>
      </div>
    </div>

    <div class="text-center fs-4 text-secondary mb-3">↓</div>

    <!-- STEP 3: converti -->
    <div class="card">
      <div class="card-body">
        <label class="form-label fw-bold">③ Converti e scarica</label><br>
        <button id="btnConverti" onclick="converti()" disabled class="btn btn-primary mt-1">
          Converti
        </button>
        <div id="messaggio" class="alert mt-3 d-none" role="alert"></div>
      </div>
    </div>

  </div>

  <script>
    const fileInput  = document.getElementById('fileInput');
    const formatoSel = document.getElementById('formatoDestinazione');
    const btnConv    = document.getElementById('btnConverti');
    const infoFile   = document.getElementById('infoFile');

    fileInput.addEventListener('change', aggiornaStato);
    formatoSel.addEventListener('change', aggiornaStato);

    function aggiornaStato() {
      const file    = fileInput.files[0];
      const formato = formatoSel.value;

      if (file) {
        const ext = file.name.split('.').pop().toLowerCase();
        const badgeClass = { json: 'text-bg-warning', xml: 'text-bg-primary', csv: 'text-bg-success' };
        infoFile.classList.remove('d-none');
        infoFile.innerHTML =
          `File selezionato: <strong>${file.name}</strong>` +
          ` <span class="badge ${badgeClass[ext] || 'text-bg-secondary'}">${ext.toUpperCase()}</span>` +
          ` — ${(file.size / 1024).toFixed(1)} KB`;
      } else {
        infoFile.classList.add('d-none');
      }

      btnConv.disabled = !(file && formato);
    }

    async function converti() {
      const file    = fileInput.files[0];
      const formato = formatoSel.value;

      if (!file || !formato) {
        mostraMessaggio('Seleziona un file e un formato di destinazione!', 'danger');
        return;
      }

      btnConv.disabled    = true;
      btnConv.textContent = 'Conversione in corso...';

      const formData = new FormData();
      formData.append('file', file);
      formData.append('formatoDestinazione', formato);

      try {
        const res = await fetch('/converti', { method: 'POST', body: formData });

        if (!res.ok) {
          const errore = await res.json();
          mostraMessaggio('Errore: ' + errore.errore, 'danger');
          return;
        }

        const blob     = await res.blob();
        const url      = URL.createObjectURL(blob);
        const link     = document.createElement('a');
        const nomeOrig = file.name.replace(/\.[^.]+$/, '');
        link.href      = url;
        link.download  = nomeOrig + '_convertito.' + formato;
        link.click();
        URL.revokeObjectURL(url);

        mostraMessaggio('✅ File convertito e scaricato!', 'success');

      } catch (err) {
        mostraMessaggio('Errore di connessione al server.', 'danger');
      } finally {
        btnConv.disabled    = false;
        btnConv.textContent = 'Converti';
      }
    }

    function mostraMessaggio(testo, tipo) {
      const msg = document.getElementById('messaggio');
      msg.textContent = testo;
      msg.className   = `alert alert-${tipo} mt-3`;
      msg.classList.remove('d-none');
    }
  </script>

</body>
</html>
